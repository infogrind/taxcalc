# Tax rates for tax year 2025 (Steuerperiode 2025).
# Edit this file (or drop an override into ~/.config/taxcalc/rates/2025.toml) when rates change.

[federal]
# Direkte Bundessteuer, Art. 36 DBG, tariff 2025 as published by the ESTV
# (ESTV Rundschreiben 2-210-D-2024).
income_rounding = 100   # taxable income is rounded down to a multiple of this
minimum_tax = 25        # tax amounts below this are not levied (Art. 36 Abs. 3)
child_reduction = 263     # reduction of the tax amount per child (Art. 36 Abs. 2bis)

# Each step: [income threshold, tax at that income, CHF per further CHF 100].
# From flat_from on, the tax is flat_rate % of the whole income.
[federal.single]   # Art. 36 Abs. 1
steps = [
  [15200, 0, 0.77], [33200, 138.60, 0.88], [43500, 229.20, 2.64],
  [58000, 612.00, 2.97], [76100, 1149.55, 5.94], [82000, 1500.00, 6.60],
  [108800, 3268.80, 8.80], [141500, 6146.40, 11.00], [184900, 10920.40, 13.20],
]
flat_from = 793400
flat_rate = 11.5

[federal.married]  # Art. 36 Abs. 2 (also single parents living with children)
steps = [
  [29700, 0, 1], [53400, 237, 2], [61300, 395, 3], [79100, 929, 4], [94900, 1561, 5],
  [108600, 2246, 6], [120500, 2960, 7], [130500, 3660, 8], [138300, 4284, 9],
  [144200, 4815, 10], [148200, 5215, 11], [150300, 5446, 12], [152300, 5686, 13],
]
flat_from = 940900
flat_rate = 11.5

[zurich]
# Staats- und Gemeindesteuer Kanton Zürich.
# Tariffs: § 35 / § 47 StG as adjusted for inflation from 1.1.2024 (Verordnung über den
# Ausgleich der kalten Progression vom 28. Juni 2023, valid for 2024 and 2025).
# Staatssteuerfuss 2024/2025: Kantonsratsbeschluss (98%).
canton_steuerfuss = 98   # % of the einfache Staatssteuer
personal_tax = 24        # Personalsteuer per adult (§ 199 StG)
income_rounding = 100    # taxable income is rounded down to a multiple of this
assets_rounding = 1000   # taxable assets are rounded down to a multiple of this

# Each bracket: [width in CHF, rate]. Income rates in %, asset rates in per mille.
# top_rate applies to everything above the listed brackets.
[zurich.income.single]   # Grundtarif, § 35 Abs. 1 StG
brackets = [
  [6900, 0], [4900, 2], [4800, 3], [7900, 4], [9600, 5], [11000, 6],
  [12900, 7], [17400, 8], [33600, 9], [33200, 10], [52700, 11], [68400, 12],
]
top_rate = 13

[zurich.income.married]  # Verheiratetentarif, § 35 Abs. 2 StG
brackets = [
  [13900, 0], [6300, 2], [8000, 3], [9700, 4], [11100, 5], [14300, 6],
  [31800, 7], [31900, 8], [47900, 9], [57200, 10], [62100, 11], [71600, 12],
]
top_rate = 13

[zurich.assets.single]   # Grundtarif, § 47 Abs. 1 StG (per mille)
brackets = [
  [80000, 0], [238000, 0.5], [399000, 1], [636000, 1.5], [956000, 2], [953000, 2.5],
]
top_rate = 3

[zurich.assets.married]  # Verheiratetentarif, § 47 Abs. 2 StG (per mille)
brackets = [
  [159000, 0], [239000, 0.5], [397000, 1], [637000, 1.5], [955000, 2], [955000, 2.5],
]
top_rate = 3

